suite: elabftw deployment
templates:
  - templates/deployment.yaml

release:
  name: test

set:
  elabftw.siteUrl: "https://test.example.com"
  elabftw.secrets.existingSecret: "test-secret"

tests:
  - it: renders a Deployment
    asserts:
      - isKind:
          of: Deployment

  - it: sets correct deployment name
    asserts:
      - equal:
          path: metadata.name
          value: test-elabftw

  - it: sets replicas from values
    set:
      elabftw.replicaCount: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: sets rolling update strategy
    asserts:
      - equal:
          path: spec.strategy.type
          value: RollingUpdate
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 0
      - equal:
          path: spec.strategy.rollingUpdate.maxSurge
          value: 1

  - it: sets pod app label
    asserts:
      - exists:
          path: spec.template.metadata.labels.app

  - it: adds pod labels when configured
    set:
      elabftw.podLabels:
        custom-label: test
    asserts:
      - equal:
          path: spec.template.metadata.labels.custom-label
          value: test

  - it: adds pod annotations when configured
    set:
      elabftw.podAnnotations:
        prometheus.io/scrape: "true"
    asserts:
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "true"

  - it: sets container image
    set:
      elabftw.image.repository: myrepo/elabftw
      elabftw.image.tag: "1.2.3"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: myrepo/elabftw:1.2.3

  - it: sets image pull policy
    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent

  - it: sets container port
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 443

  - it: sets resources when configured
    set:
      elabftw.resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 100m

  - it: configures site URL environment variable
    set:
      elabftw.siteUrl: "https://elab.example.com"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SITE_URL
            value: "https://elab.example.com"

  - it: configures nginx server name environment variable
    set:
      elabftw.serverName: elab.example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVER_NAME
            value: elab.example.com

  - it: configures upload settings
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MAX_UPLOAD_SIZE
            value: 100M

  - it: configures PHP timezone
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PHP_TIMEZONE
            value: Europe/Vienna

  - it: disables redis by default
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: USE_REDIS
            value: "false"

  - it: enables internal redis
    set:
      redis.enabled: true
      redis.auth.enabled: true
      redis.auth.password: redisPassword
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: USE_REDIS
            value: "true"

      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_HOST
            value: test-elabftw-redis-master

      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_PORT
            value: "6379"

      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: test-elabftw-redis
                key: redis-password

  - it: uses existing secret for internal redis
    set:
      redis.enabled: true
      redis.auth.enabled: true
      redis.auth.existingSecret: custom-redis-secret
      redis.auth.existingSecretPasswordKey: redis-password
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: USE_REDIS
            value: "true"

      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: custom-redis-secret
                key: redis-password

  - it: enables external redis
    set:
      redis.enabled: false
      externalRedis.enabled: true
      externalRedis.host: redis.example.com
      externalRedis.port: 6380
      externalRedis.passwordKey: password
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: USE_REDIS
            value: "true"

      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_HOST
            value: redis.example.com

      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_PORT
            value: "6380"

      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: test-elabftw-external-redis
                key: password

  - it: uses existing secret for external redis
    set:
      redis.enabled: false
      externalRedis.enabled: true
      externalRedis.host: redis.example.com
      externalRedis.port: 6379
      externalRedis.existingSecret: custom-external-redis-secret
      externalRedis.passwordKey: redis-password
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: USE_REDIS
            value: "true"

      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: custom-external-redis-secret
                key: redis-password

  - it: does not expose internal redis password as plain environment value
    set:
      redis.enabled: true
      redis.auth.enabled: true
      redis.auth.password: redisPassword
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_PASSWORD
            value: redisPassword

  - it: mounts persistent volume when enabled
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: data
            mountPath: /elabftw/uploads

  - it: disables persistent volume when persistence is disabled
    set:
      elabftw.persistence.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts

  - it: sets node selector
    set:
      elabftw.nodeSelector:
        kubernetes.io/hostname: worker-1
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector["kubernetes.io/hostname"]
          value: worker-1

  - it: sets tolerations
    set:
      elabftw.tolerations:
        - key: dedicated
          operator: Equal
          value: web
          effect: NoSchedule
    asserts:
      - equal:
          path: spec.template.spec.tolerations[0].key
          value: dedicated

  - it: sets affinity
    set:
      elabftw.affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
    asserts:
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution[0].topologyKey
          value: kubernetes.io/hostname

  - it: does not configure chem plugin when disabled
    set:
      addons.chemPlugin.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: USE_INDIGO
            value: "true"

  - it: configures Indigo when chem plugin is enabled
    set:
      addons.chemPlugin.enabled: true
      addons.chemPlugin.indigo.enabled: true
      addons.chemPlugin.indigo.url: "http://chem-plugin:8080/"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: USE_INDIGO
            value: "true"

      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INDIGO_URL
            value: "http://chem-plugin:8080/"

  - it: configures fingerprinter when chem plugin is enabled
    set:
      addons.chemPlugin.enabled: true
      addons.chemPlugin.fingerprinter.enabled: true
      addons.chemPlugin.fingerprinter.url: "http://chem-plugin:8000/"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: USE_FINGERPRINTER
            value: "true"

      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FINGERPRINTER_URL
            value: "http://chem-plugin:8000/"

  - it: does not configure opencloning when disabled
    set:
      addons.opencloning.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENCLONING_URL

  - it: configures opencloning when enabled
    set:
      addons.opencloning.enabled: true
      addons.opencloning.url: "http://opencloning/"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENCLONING_URL
            value: "http://opencloning/"
