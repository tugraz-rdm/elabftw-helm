suite: elabftw deployment

templates:
  - templates/deployment.yaml

release:
  name: test

set:
  elabftw.siteUrl: "https://test.example.com"
  elabftw.secrets.existingSecret: "test-secret"

tests:

  # ---------------------------------------------------------------------------
  # Basic Deployment
  # ---------------------------------------------------------------------------

  - it: renders a Deployment
    asserts:
      - isKind:
          of: Deployment

  - it: sets correct deployment name
    asserts:
      - equal:
          path: metadata.name
          value: test-elabftw

  - it: sets replicas from values
    set:
      elabftw.replicaCount: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  # ---------------------------------------------------------------------------
  # Update strategy
  # ---------------------------------------------------------------------------

  - it: sets rolling update strategy
    asserts:
      - equal:
          path: spec.strategy.type
          value: RollingUpdate
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 0
      - equal:
          path: spec.strategy.rollingUpdate.maxSurge
          value: 1

  - it: does not render rolling update configuration for non RollingUpdate strategy
    set:
      elabftw.updateStrategy.type: Recreate
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate
      - notExists:
          path: spec.strategy.rollingUpdate

  # ---------------------------------------------------------------------------
  # Pod labels and annotations
  # ---------------------------------------------------------------------------

  - it: sets pod app label
    asserts:
      - exists:
          path: spec.template.metadata.labels.app

  - it: adds pod labels when configured
    set:
      elabftw.podLabels:
        custom-label: test
    asserts:
      - equal:
          path: spec.template.metadata.labels.custom-label
          value: test

  - it: adds pod annotations when configured
    set:
      elabftw.podAnnotations:
        prometheus.io/scrape: "true"
    asserts:
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "true"

  # ---------------------------------------------------------------------------
  # Pod security context
  # ---------------------------------------------------------------------------

  - it: sets pod runAsUser
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1002

  - it: sets pod runAsGroup
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsGroup
          value: 1002

  - it: runs pod as non-root
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true

  - it: sets pod fsGroup
    asserts:
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1002

  # ---------------------------------------------------------------------------
  # Container security context
  # ---------------------------------------------------------------------------

  - it: disables privilege escalation
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false

  - it: uses read-only root filesystem
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true

  - it: drops all Linux capabilities
    asserts:
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  # ---------------------------------------------------------------------------
  # Container image
  # ---------------------------------------------------------------------------

  - it: sets container image
    set:
      elabftw.image.repository: myrepo/elabftw
      elabftw.image.tag: "1.2.3"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: myrepo/elabftw:1.2.3

  - it: uses chart appVersion when image tag is not configured
    set:
      elabftw.image.repository: myrepo/elabftw
      elabftw.image.tag: ""
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: myrepo/elabftw:6.0.5

  - it: sets image pull policy
    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent

  # ---------------------------------------------------------------------------
  # Container port
  # ---------------------------------------------------------------------------

  - it: sets container port
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8080

  - it: names the container port http
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].name
          value: http

  # ---------------------------------------------------------------------------
  # Resources
  # ---------------------------------------------------------------------------

  - it: sets resources when configured
    set:
      elabftw.resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 100m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 256Mi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 500m
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 512Mi

  # ---------------------------------------------------------------------------
  # Probes
  # ---------------------------------------------------------------------------

  - it: configures readiness probe
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.tcpSocket.port
          value: http
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.initialDelaySeconds
          value: 30
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.periodSeconds
          value: 10

  - it: configures liveness probe
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.tcpSocket.port
          value: http
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
          value: 60
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.periodSeconds
          value: 20

  # ---------------------------------------------------------------------------
  # Environment - eLabFTW
  # ---------------------------------------------------------------------------

  - it: configures site URL environment variable
    set:
      elabftw.siteUrl: "https://elab.example.com"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SITE_URL
            value: "https://elab.example.com"

  - it: configures HTTPS setting
    set:
      elabftw.disableHttps: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DISABLE_HTTPS
            value: "true"

  - it: disables real IP handling
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SET_REAL_IP
            value: "false"

  # ---------------------------------------------------------------------------
  # Environment - uploads
  # ---------------------------------------------------------------------------

  - it: configures maximum upload size
    set:
      elabftw.uploads.maxSize: 500M
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MAX_UPLOAD_SIZE
            value: "500M"

  - it: configures maximum upload time
    set:
      elabftw.uploads.maxTime: 3600
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MAX_UPLOAD_TIME
            value: "3600"

  # ---------------------------------------------------------------------------
  # Environment - PHP
  # ---------------------------------------------------------------------------

  - it: configures PHP timezone
    set:
      global.timezone: Europe/Vienna
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PHP_TIMEZONE
            value: Europe/Vienna

  - it: configures container timezone
    set:
      global.timezone: Europe/Vienna
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TZ
            value: Europe/Vienna

  - it: configures PHP memory limit
    set:
      elabftw.php.memoryLimit: 512M
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MAX_PHP_MEMORY
            value: "512M"

  - it: configures PHP max children
    set:
      elabftw.php.maxChildren: 20
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PHP_MAX_CHILDREN
            value: "20"

  - it: configures PHP max execution time
    set:
      elabftw.php.maxExecutionTime: 3600
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PHP_MAX_EXECUTION_TIME
            value: "3600"

  # ---------------------------------------------------------------------------
  # Environment - OpenCloning
  # ---------------------------------------------------------------------------

  - it: does not configure opencloning when disabled
    set:
      addons.opencloning.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENCLONING_URL

  - it: configures opencloning when enabled
    set:
      addons.opencloning.enabled: true
      addons.opencloning.url: "http://opencloning/"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OPENCLONING_URL
            value: "http://opencloning/"

      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: USE_OPENCLONING
            value: "true"

  # ---------------------------------------------------------------------------
  # Environment - Redis
  # ---------------------------------------------------------------------------

  - it: disables redis by default
    set:
      redis.enabled: false
      externalRedis.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: USE_REDIS
            value: "false"

  - it: enables internal redis
    set:
      redis.enabled: true
      redis.auth.enabled: true
      redis.auth.password: redisPassword
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: USE_REDIS
            value: "true"

      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_HOST
            value: test-elabftw-redis-master

      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_PORT
            value: "6379"

      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: test-elabftw-redis
                key: redis-password

  - it: uses existing secret for internal redis
    set:
      redis.enabled: true
      redis.auth.enabled: true
      redis.auth.existingSecret: custom-redis-secret
      redis.auth.existingSecretPasswordKey: redis-password
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: USE_REDIS
            value: "true"

      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: custom-redis-secret
                key: redis-password

  - it: enables external redis
    set:
      redis.enabled: false
      externalRedis.enabled: true
      externalRedis.host: redis.example.com
      externalRedis.port: 6380
      externalRedis.passwordKey: password
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: USE_REDIS
            value: "true"

      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_HOST
            value: redis.example.com

      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_PORT
            value: "6380"

      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: test-elabftw-external-redis
                key: password

  - it: uses existing secret for external redis
    set:
      redis.enabled: false
      externalRedis.enabled: true
      externalRedis.host: redis.example.com
      externalRedis.port: 6379
      externalRedis.existingSecret: custom-external-redis-secret
      externalRedis.passwordKey: redis-password
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: custom-external-redis-secret
                key: redis-password

  - it: does not expose internal redis password as plain environment value
    set:
      redis.enabled: true
      redis.auth.enabled: true
      redis.auth.password: redisPassword
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_PASSWORD
            value: redisPassword

  # ---------------------------------------------------------------------------
  # Persistence
  # ---------------------------------------------------------------------------

  - it: mounts persistent volume when enabled
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: run
            mountPath: /run

      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: data
            mountPath: /var/lib/elabftw/uploads

      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: data
            mountPath: /var/lib/elabftw/exports
            subPath: exports

      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: data
            mountPath: /var/cache/elabftw
            subPath: cache

  - it: disables data volume mounts when persistence is disabled
    set:
      elabftw.persistence.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: run
            mountPath: /run

      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: data

  - it: configures persistent volume claim
    set:
      elabftw.persistence.enabled: true
      elabftw.persistence.existingClaim: my-existing-pvc
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            persistentVolumeClaim:
              claimName: my-existing-pvc

  - it: uses default persistent volume claim name
    set:
      elabftw.persistence.enabled: true
      elabftw.persistence.existingClaim: ""
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            persistentVolumeClaim:
              claimName: test-elabftw-pvc

  # ---------------------------------------------------------------------------
  # Runtime volume
  # ---------------------------------------------------------------------------

  - it: configures writable runtime filesystem
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: run
            emptyDir:
              medium: Memory
              sizeLimit: 64Mi

  # ---------------------------------------------------------------------------
  # Node selector
  # ---------------------------------------------------------------------------

  - it: sets node selector
    set:
      elabftw.nodeSelector:
        kubernetes.io/hostname: worker-1
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector["kubernetes.io/hostname"]
          value: worker-1

  # ---------------------------------------------------------------------------
  # Tolerations
  # ---------------------------------------------------------------------------

  - it: sets tolerations
    set:
      elabftw.tolerations:
        - key: dedicated
          operator: Equal
          value: web
          effect: NoSchedule
    asserts:
      - equal:
          path: spec.template.spec.tolerations[0].key
          value: dedicated
      - equal:
          path: spec.template.spec.tolerations[0].operator
          value: Equal
      - equal:
          path: spec.template.spec.tolerations[0].value
          value: web
      - equal:
          path: spec.template.spec.tolerations[0].effect
          value: NoSchedule

  # ---------------------------------------------------------------------------
  # Affinity
  # ---------------------------------------------------------------------------

  - it: sets affinity
    set:
      elabftw.affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
    asserts:
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution[0].topologyKey
          value: kubernetes.io/hostname

  # ---------------------------------------------------------------------------
  # Extra environment variables
  # ---------------------------------------------------------------------------

  - it: adds extra environment variables
    set:
      elabftw.extraEnv:
        - name: CUSTOM_ENV
          value: custom-value
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CUSTOM_ENV
            value: custom-value
