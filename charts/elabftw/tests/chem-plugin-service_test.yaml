suite: Chem Plugin Service

templates:
  - chem-plugin-service.yaml

tests:

  - it: should not create service when disabled
    set:
      addons.chemPlugin.enabled: false
    asserts:
      - hasDocuments:
          count: 0


  - it: should create service when enabled
    set:
      addons.chemPlugin.enabled: true

    asserts:

      - equal:
          path: metadata.name
          value: chem-plugin

      - equal:
          path: spec.type
          value: ClusterIP

      - equal:
          path: spec.ports[0].port
          value: 80

      - equal:
          path: spec.ports[0].targetPort
          value: 8000
