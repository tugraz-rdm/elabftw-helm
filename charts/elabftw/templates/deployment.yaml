apiVersion: apps/v1

kind: Deployment

metadata:
  name: {{ include "elabftw.fullname" . }}

spec:
  replicas: {{ .Values.elabftw.replicaCount }}

  strategy:
    type: {{ .Values.elabftw.updateStrategy.type }}

{{- if eq .Values.elabftw.updateStrategy.type "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: {{ .Values.elabftw.updateStrategy.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.elabftw.updateStrategy.rollingUpdate.maxSurge }}
{{- end }}

  selector:
    matchLabels:
      app: {{ include "elabftw.name" . }}

  template:
    metadata:
      labels:
        app: {{ include "elabftw.name" . }}

{{- with .Values.elabftw.podLabels }}
{{ toYaml . | nindent 8 }}
{{- end }}

{{- with .Values.elabftw.podAnnotations }}
      annotations:
{{ toYaml . | nindent 8 }}
{{- end }}

    spec:
      securityContext:
        fsGroup: {{ .Values.elabftw.podSecurityContext.fsGroup }}
        fsGroupChangePolicy: {{ .Values.elabftw.podSecurityContext.fsGroupChangePolicy }}
        seccompProfile:
          type: {{ .Values.elabftw.podSecurityContext.seccompProfile.type }}

      containers:
        - name: {{ include "elabftw.name" . }}

          image: "{{ .Values.elabftw.image.repository }}:{{ .Values.elabftw.image.tag | default .Chart.AppVersion }}"

          imagePullPolicy: {{ .Values.elabftw.image.pullPolicy }}

          securityContext:
            runAsNonRoot: {{ .Values.elabftw.securityContext.runAsNonRoot }}
            runAsUser: {{ .Values.elabftw.securityContext.runAsUser }}
            runAsGroup: {{ .Values.elabftw.securityContext.runAsGroup }}
            allowPrivilegeEscalation: {{ .Values.elabftw.securityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.elabftw.securityContext.readOnlyRootFilesystem }}
            capabilities:
              drop:
                {{- toYaml .Values.elabftw.securityContext.capabilities.drop | nindent 16 }}

          ports:
            - name: http
              containerPort: {{ .Values.elabftw.container.port }}
              protocol: TCP

{{- with .Values.elabftw.resources }}
          resources:
{{ toYaml . | nindent 12 }}
{{- end }}

          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20

          env:

{{- if .Values.addons.opencloning.enabled }}
            ################
            # OPENCLONING
            ################
            - name: OPENCLONING_URL
              value: {{ .Values.addons.opencloning.url | quote }}

            - name: USE_OPENCLONING
              value: "true"

{{- end }}

            ################
            # DATABASE
            ################

            - name: DB_HOST
              value: {{ include "elabftw.database.host" . | quote }}

            - name: DB_PORT
              value: {{ include "elabftw.database.port" . | quote }}

            - name: DB_NAME
              value: {{ include "elabftw.database.name" . | quote }}

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "elabftw.database.secretName" . }}
                  key: {{ include "elabftw.database.usernameKey" . }}

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "elabftw.database.secretName" . }}
                  key: {{ include "elabftw.database.passwordKey" . }}

            ################
            # ELABFTW
            ################

            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secret" (include "elabftw.fullname" .)) .Values.elabftw.secrets.existingSecret }}
                  key: SECRET_KEY

            - name: SITE_URL
              value: {{ .Values.elabftw.siteUrl | quote }}

            - name: DISABLE_HTTPS
              value: {{ .Values.elabftw.disableHttps | quote }}

            - name: SET_REAL_IP
              value: "false"

            ################
            # UPLOADS
            ################

            - name: MAX_UPLOAD_SIZE
              value: {{ .Values.elabftw.uploads.maxSize | quote }}

            - name: MAX_UPLOAD_TIME
              value: {{ .Values.elabftw.uploads.maxTime | quote }}

            ################
            # FEATURES
            ################

            - name: AUTO_DB_INIT
              value: {{ .Values.elabftw.features.autoDbInit | quote }}

            - name: AUTO_DB_UPDATE
              value: {{ .Values.elabftw.features.autoDbUpdate | quote }}

            - name: DEMO_MODE
              value: {{ .Values.elabftw.features.demoMode | quote }}

            - name: MAINTENANCE_MODE
              value: {{ .Values.elabftw.features.maintenanceMode | quote }}

            ################
            # PHP
            ################

            - name: PHP_TIMEZONE
              value: {{ .Values.global.timezone | quote }}

            - name: TZ
              value: {{ .Values.global.timezone | quote }}

            - name: MAX_PHP_MEMORY
              value: {{ .Values.elabftw.php.memoryLimit | quote }}

            - name: PHP_MAX_CHILDREN
              value: {{ .Values.elabftw.php.maxChildren | quote }}

            - name: PHP_MAX_EXECUTION_TIME
              value: {{ .Values.elabftw.php.maxExecutionTime | quote }}

            ################
            # MYSQL OPTIONS
            ################

            - name: USE_PERSISTENT_MYSQL_CONN
              value: {{ .Values.elabftw.database.persistentConnection | quote }}

{{- if or .Values.redis.enabled .Values.externalRedis.enabled }}

            ################
            # REDIS
            ################

            - name: USE_REDIS
              value: "true"

            - name: REDIS_HOST
              value: {{ if .Values.redis.enabled }}{{ printf "%s-redis-master" (include "elabftw.fullname" .) | quote }}{{ else }}{{ .Values.externalRedis.host | quote }}{{ end }}

            - name: REDIS_PORT
              value: {{ if .Values.redis.enabled }}"6379"{{ else }}{{ .Values.externalRedis.port | quote }}{{ end }}

{{- if and .Values.externalRedis.enabled .Values.externalRedis.username }}
            - name: REDIS_USERNAME
              value: {{ .Values.externalRedis.username | quote }}
{{- end }}

            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.redis.enabled }}{{ default (printf "%s-redis" (include "elabftw.fullname" .)) .Values.redis.auth.existingSecret }}{{ else }}{{ default (printf "%s-external-redis" (include "elabftw.fullname" .)) .Values.externalRedis.existingSecret }}{{ end }}
                  key: {{ if .Values.redis.enabled }}{{ default "redis-password" .Values.redis.auth.existingSecretPasswordKey }}{{ else }}{{ default "password" .Values.externalRedis.passwordKey }}{{ end }}

{{- else }}

            - name: USE_REDIS
              value: "false"

{{- end }}

{{- with .Values.elabftw.extraEnv }}
{{ toYaml . | nindent 12 }}
{{- end }}

          volumeMounts:

{{- if .Values.elabftw.persistence.enabled }}

            # eLabFTW uploaded files
            - name: data
              mountPath: /var/lib/elabftw/uploads

            # eLabFTW generated exports
            - name: data
              mountPath: /var/lib/elabftw/exports
              subPath: {{ .Values.elabftw.persistence.exportsPath }}

{{- end }}

            # Writable cache required by eLabFTW v6
            - name: cache
              mountPath: /var/cache/elabftw

            # Writable /run required by eLabFTW v6
            - name: run
              mountPath: /run

      volumes:

{{- if .Values.elabftw.persistence.enabled }}

        - name: data
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-pvc" (include "elabftw.fullname" .)) .Values.elabftw.persistence.existingClaim }}

{{- end }}

        # eLabFTW cache
        - name: cache
          emptyDir: {}

        # eLabFTW /run
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi

{{- with .Values.elabftw.nodeSelector }}
      nodeSelector:
{{ toYaml . | nindent 8 }}
{{- end }}

{{- with .Values.elabftw.affinity }}
      affinity:
{{ toYaml . | nindent 8 }}
{{- end }}

{{- with .Values.elabftw.tolerations }}
      tolerations:
{{ toYaml . | nindent 8 }}
{{- end }}
