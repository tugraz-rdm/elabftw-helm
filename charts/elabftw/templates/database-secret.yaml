{{- if and (not .Values.mysql.enabled) (not .Values.externalDatabase.existingSecret) }}

apiVersion: v1
kind: Secret

metadata:
  name: {{ include "elabftw.database.secretName" . }}

type: Opaque

stringData:
  username: {{ .Values.externalDatabase.username | quote }}
  password: {{ .Values.externalDatabase.password | quote }}

{{- end }}
