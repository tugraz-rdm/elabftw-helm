name: Lint and Test Charts

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4.2.0
        with:
          version: v3.21.3

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.13' # 3.12 was broken and 3.14 not supported by Yamale yet
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.7.0

      - name: Run chart-testing (lint)
        run: ct lint --all

      - name: Install tools
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest.git
          KUBECONFORM_VERSION=v0.8.0
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Run unit tests
        run: helm unittest charts/elabftw

      - name: Build Helm dependencies
        run: helm dependency build charts/elabftw

      - name: Validate rendered manifests (full values)
        run: |
          helm template test charts/elabftw \
            -f charts/elabftw/ci/full-values.yaml | \
            kubeconform --strict --summary
